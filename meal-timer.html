<!DOCTYPE html>
<html lang="ko">
  <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#fff6ed"><title>식사 타이머 | 미식쉴드</title><link rel="stylesheet" href="assets/css/styles.css"><link rel="stylesheet" href="assets/css/coaching.css"></head>
  <body data-page="meal-timer">
    <header class="site-header"><div class="header-inner"><a class="brand" href="index.html" aria-label="미식쉴드 홈"><img src="assets/figma/logo.svg" alt="미식쉴드"></a><nav class="desktop-nav" aria-label="주요 메뉴"><a href="index.html">홈</a><a href="menu-input.html">메뉴입력</a><a href="burden-result.html">결과</a><a href="personalization.html">개인화</a><a class="active" href="coaching-plan.html">타이머</a></nav><a class="profile-button" href="account.html" aria-label="계정 및 사용자 데이터"><img src="assets/figma/profile.png" alt=""></a></div></header>
    <main class="coaching-main">
      <header class="coaching-heading"><h1>식사 타이머</h1><p>안내되는 순서에 맞춰 천천히 식사해보세요.</p></header>
      <div class="timer-layout" data-timer-view>
        <section class="timer-card"><span class="timer-stage-badge" data-stage-badge>1단계</span><h2 data-stage-title>단백질부터</h2><p class="timer-guide" data-stage-guide>단백질 음식부터 시작해보세요.</p><div class="timer-ring" data-timer-ring><strong class="timer-time" data-timer-time>05:00</strong></div><div class="coach-action-row"><button class="coach-secondary" type="button" data-pause>일시정지</button><button class="coach-primary" type="button" data-next>다음 단계</button><button class="coach-secondary" type="button" data-end>식사 종료</button></div><p class="coach-status" role="status" data-timer-status></p></section>
        <aside class="timer-aside"><h2>진행 단계</h2><ol class="timer-stage-list" data-timer-stages></ol></aside>
      </div>
      <section class="coach-panel completion-view" data-completion-view hidden><span class="completion-label">식사 완료</span><h2>식사를 완료하였습니다!</h2><p>오늘도 건강한 식사 습관을 실천하셨어요.</p><img class="completion-check" src="assets/figma/complete-check.png" alt="식사 완료"><div class="completion-summary"><span>완료 단계<strong data-completed-stages>-</strong></span><span>건너뛴 단계<strong data-skipped-stages>-</strong></span><span>순서 준수율<strong data-adherence-rate>-</strong></span><span>총 식사 시간<strong data-total-time>-</strong></span></div><div class="coach-action-row"><a class="coach-primary" href="index.html">홈으로 돌아가기</a><a class="coach-secondary" href="coaching-history.html">코칭 기록 보기</a></div></section>
    </main>
    <script src="assets/js/api.js"></script><script src="assets/js/auth-header.js"></script><script src="assets/js/feedback-ui.js"></script><script src="assets/js/meal-timer.js"></script>
  </body>
</html>
