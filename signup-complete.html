<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" >
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" >
    <meta name="theme-color" content="#fff6ed" >
    <title>가입 완료 | 미식쉐드</title>
    <link rel="stylesheet" href="assets/css/styles.css" >
  </head>
  <body data-page="signup-complete">
    <header class="site-header compact-header">
      <div class="header-inner">
        <a class="brand" href="index.html" aria-label="미식쉐드 홈">
          <img src="assets/figma/logo.svg" alt="미식쉐드" >
        </a>
        <a class="profile-button" href="login.html" aria-label="로그인">
          <img src="assets/figma/profile.png" alt="" >
        </a>
      </div>
    </header>

    <main class="signup-main complete-page">
      <section class="signup-panel" aria-labelledby="complete-title">
        <ol class="steps">
          <li class="complete"><span>✓</span>본인인증</li>
          <li class="complete"><span>✓</span>정보입력</li>
          <li class="active"><span>3</span>가입완료</li>
        </ol>

        <div class="complete-content">
          <p>환영합니다!</p>
          <h1 id="complete-title">이제부터 미식쉐드 회원에게 제공되는<br >다양한 서비스를 이용해 보세요!</h1>
          <img class="complete-check" src="assets/figma/complete-check.png" alt="" >
          <p class="complete-note">가입 내역 조회 및 수정은 <em>마이페이지</em> &gt; <em>개인정보수정</em>에서 확인 가능합니다.</p>
          <div class="complete-actions">
            <a class="secondary-button" href="index.html">홈으로</a>
            <a class="primary-button" href="login.html">로그인</a>
          </div>
        </div>
      </section>
    </main>

  </body>
</html>
