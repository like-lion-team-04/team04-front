<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" >
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" >
    <meta name="theme-color" content="#fff6ed" >
    <title>메뉴 직접 선택 | 미식쉐드</title>
    <link rel="stylesheet" href="assets/css/styles.css" >
    <link rel="stylesheet" href="assets/css/menu.css" >
  </head>
  <body data-page="menu-select">
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="index.html" aria-label="미식쉐드 홈"><img src="assets/figma/logo.svg" alt="미식쉐드" ></a>
        <nav class="desktop-nav" aria-label="주요 메뉴">
          <a href="index.html">홈</a><a class="active" href="menu-input.html">메뉴입력</a><a href="#">결과</a><a href="#">개인화</a><a href="#">타이머</a>
        </nav>
        <a class="profile-button" href="account.html" aria-label="계정 및 사용자 데이터"><img src="assets/figma/profile.png" alt="" ></a>
      </div>
    </header>
    <main class="menu-main" data-menu-select>
      <div class="search-box"><label class="sr-only" for="food-search">메뉴 검색</label><input id="food-search" type="search" placeholder="메뉴를 검색하거나 초성으로 찾아보세요" autocomplete="off" data-food-search ></div>
      <div class="category-tabs" role="group" aria-label="메뉴 카테고리">
        <button class="category-tab active" type="button" data-category="ALL">전체</button>
        <button class="category-tab" type="button" data-category="RICE">밥류</button>
        <button class="category-tab" type="button" data-category="NOODLE">면류</button>
        <button class="category-tab" type="button" data-category="FLOUR">분식류</button>
        <button class="category-tab" type="button" data-category="SOUP">탕류</button>
        <button class="category-tab" type="button" data-category="BREAD">빵류</button>
      </div>
      <section class="menu-columns" aria-label="메뉴 선택">
        <div class="menu-column">
          <h1 class="column-title">검색결과 · <span>전체</span></h1>
          <div class="food-list" data-food-results></div>
        </div>
        <div class="menu-column">
          <h2 class="column-title">선택한 메뉴</h2>
          <div class="selected-list" data-selected-list aria-live="polite"></div>
        </div>
      </section>
      <div class="menu-submit-row"><button class="menu-primary-button" type="button">선택 완료</button></div>
    </main>
    <script src="assets/js/api-contract.js"></script>
    <script src="assets/js/menu.js"></script>
  </body>
</html>
