<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" >
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" >
    <meta name="theme-color" content="#fff6ed" >
    <title>본인인증 | 미식쉐드</title>
    <link rel="stylesheet" href="assets/css/styles.css" >
  </head>
  <body data-page="signup-verify">
    <header class="site-header compact-header">
      <div class="header-inner">
        <a class="brand" href="index.html" aria-label="미식쉐드 홈">
          <img src="assets/figma/logo.svg" alt="미식쉐드" >
        </a>
        <a class="profile-button" href="login.html" aria-label="로그인">
          <img src="assets/figma/profile.png" alt="" >
        </a>
      </div>
    </header>

    <main class="signup-main">
      <section class="signup-panel" aria-labelledby="verify-title">
        <ol class="steps">
          <li class="active"><span>1</span>본인인증</li>
          <li><span>2</span>정보입력</li>
          <li><span>3</span>가입완료</li>
        </ol>

        <div class="signup-heading">
          <p>회원가입</p>
          <h1 id="verify-title">본인인증 수단을 선택해 주세요.</h1>
        </div>

        <a class="verification-card" href="signup-info.html">
          <img class="phone-icon" src="assets/figma/phone.png" alt="" >
          <strong>휴대폰 인증</strong>
        </a>

        <p class="signup-notice">본인인증이 안 될 경우 본인인증기관 고객센터로 문의해 주세요.</p>
      </section>
    </main>
  </body>
</html>
