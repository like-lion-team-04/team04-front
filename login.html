<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" >
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" >
    <meta name="theme-color" content="#fff6ed" >
    <title>로그인 | 미식쉐드</title>
    <link rel="stylesheet" href="assets/css/styles.css" >
  </head>
  <body data-page="login">
    <header class="site-header compact-header">
      <div class="header-inner">
        <a class="brand" href="index.html" aria-label="미식쉐드 홈">
          <img src="assets/figma/logo.svg" alt="미식쉐드" >
        </a>
        <a class="profile-button" href="login.html" aria-label="로그인">
          <img src="assets/figma/profile.png" alt="" >
        </a>
      </div>
    </header>

    <main class="auth-main">
      <section class="auth-panel" aria-labelledby="login-title">
        <h1 id="login-title">LOGIN</h1>
        <div class="form-layout">
          <div class="field-group">
            <label for="login-email">아이디</label>
            <input id="login-email" name="email" type="email" autocomplete="email" required >
            <p class="field-error" data-error-for="login-email"></p>
          </div>
          <div class="field-group">
            <label for="login-password">비밀번호</label>
            <input id="login-password" name="password" type="password" autocomplete="current-password" required >
          </div>
          <label class="check-row save-email">
            <input id="remember-email" type="checkbox" >
            <span>이메일 저장</span>
          </label>
          <a class="primary-button form-submit" href="index.html">로그인</a>
        </div>

        <div class="auth-links">
          <a href="signup-verify.html">회원가입</a>
          <button type="button" data-coming-soon>이메일 찾기</button>
          <button type="button" data-coming-soon>비밀번호 찾기</button>
        </div>

        <div class="social-divider"><span>SNS 계정으로 로그인</span></div>
        <div class="social-buttons" role="group" aria-label="소셜 로그인">
          <button type="button" aria-label="카카오 로그인"><img src="assets/figma/social-kakao.png" alt="" ></button>
          <button type="button" aria-label="네이버 로그인"><img src="assets/figma/social-naver.png" alt="" ></button>
          <button type="button" aria-label="구글 로그인"><img src="assets/figma/social-google.png" alt="" ></button>
          <button type="button" aria-label="애플 로그인"><img src="assets/figma/social-apple.png" alt="" ></button>
        </div>
      </section>
    </main>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/login.js"></script>
  </body>
</html>
