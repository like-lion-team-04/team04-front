<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" >
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" >
    <meta name="theme-color" content="#fff6ed" >
    <title>사진 입력하기 | 미식쉐드</title>
    <link rel="stylesheet" href="assets/css/styles.css" >
    <link rel="stylesheet" href="assets/css/menu.css" >
  </head>
  <body data-page="photo-input">
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="index.html" aria-label="미식쉐드 홈"><img src="assets/figma/logo.svg" alt="미식쉐드" ></a>
        <nav class="desktop-nav" aria-label="주요 메뉴">
          <a href="index.html">홈</a><a class="active" href="menu-input.html">메뉴입력</a><a href="#">결과</a><a href="#">개인화</a><a href="#">타이머</a>
        </nav>
        <a class="profile-button" href="account.html" aria-label="계정 및 사용자 데이터"><img src="assets/figma/profile.png" alt="" ></a>
      </div>
    </header>
    <main class="menu-main">
      <section class="photo-layout" aria-label="음식 사진 입력">
        <article class="upload-card">
          <div class="photo-picker" role="button" tabindex="0" data-photo-picker>
            <input type="file" accept="image/jpeg,image/png,image/webp" name="image" data-photo-input >
            <img class="photo-preview" data-photo-preview alt="" >
            <span class="photo-picker-copy"><span class="plus-icon" aria-hidden="true">+</span><strong>사진 추가</strong></span>
          </div>
          <p class="photo-help">· 메뉴판 / 배달 앱 화면 / 음식 사진 중 무엇이든 한 장이면 됩니다.</p>
        </article>
        <aside class="photo-guide">
          <h1>이런 사진을 올려보세요</h1>
          <div class="guide-examples">
            <div class="guide-example"><img src="assets/menu/menu-board-example.jpg" alt="식당 메뉴판 예시" ><p>식당 메뉴판</p></div>
            <div class="guide-example"><img src="assets/menu/delivery-example.png" alt="배달앱 주문 화면 예시" ><p>배달앱 주문 화면</p></div>
            <div class="guide-example"><img src="assets/menu/food-example.jpg" alt="실제 음식 사진 예시" ><p>실제 음식 사진</p></div>
          </div>
          <div class="guide-tips">
            <h2>잘 인식되려면</h2>
            <p>· 글씨나 음식이 또렷하게 나온 사진이 좋아요.</p>
            <p>· 여러 음식이 나와도 괜찮아요. 실제 주문한 항목만 골라드려요.</p>
            <p>· 조명이 어둡거나 흔들린 경우 인식이 어려울 수 있어요.</p>
          </div>
        </aside>
      </section>
      <div class="photo-submit-row"><button class="menu-primary-button" type="button">인식 결과 확인</button></div>
    </main>
    <script src="assets/js/api-contract.js"></script>
    <script src="assets/js/menu.js"></script>
  </body>
</html>
